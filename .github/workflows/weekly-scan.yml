name: Weekly spinoff scan

on:
  schedule:
    # 08:00 Mon Brisbane (AEST, UTC+10) = 22:00 Sun UTC
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Check secret
        env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
        run: |
          if [ -z "$SEC_EMAIL" ]; then
            echo "::error::SEC_EMAIL secret not set. Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Spin-off discovery (10-12B)
        env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
        run: python scripts/spinoff_watch.py --email "$SEC_EMAIL" --days 10 --out ./spinoff_out

      - name: Post-reorg discovery (8-K Chapter 11 / emergence)
        # continue-on-error: a failure here must not block the spin-off results
        continue-on-error: true
        env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
        run: python scripts/reorg_watch.py --email "$SEC_EMAIL" --days 10 --out ./spinoff_out

      - name: Count results
        id: count
        run: |
          count_rows () { if [ -f "$1" ]; then n=$(($(wc -l < "$1") - 1)); [ "$n" -lt 0 ] && n=0; echo $n; else echo 0; fi; }
          S=$(count_rows spinoff_out/spinoffs.csv)
          if [ -f spinoff_out/reorg.csv ]; then
            E=$(grep -c '^EMERGENCE,' spinoff_out/reorg.csv || true)
            B=$(grep -c '^BANKRUPTCY,' spinoff_out/reorg.csv || true)
            R=ok
          else
            E=0; B=0; R=failed
          fi
          echo "spin=$S"   >> $GITHUB_OUTPUT
          echo "emerge=$E" >> $GITHUB_OUTPUT
          echo "watch=$B"  >> $GITHUB_OUTPUT
          echo "reorg=$R"  >> $GITHUB_OUTPUT
          echo "spin=$S emerge=$E watch=$B reorg=$R"

      - name: Heartbeat
        # Always writes, so there is a commit every week — stops GitHub disabling the cron.
        run: |
          mkdir -p spinoff_out
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)  10-12B: ${{ steps.count.outputs.spin }}  emergence: ${{ steps.count.outputs.emerge }}  ch11-watch: ${{ steps.count.outputs.watch }}  reorg-scan: ${{ steps.count.outputs.reorg }}" \
            >> spinoff_out/scan-log.txt
          tail -n 200 spinoff_out/scan-log.txt > /tmp/log && mv /tmp/log spinoff_out/scan-log.txt

      - name: Run summary
        run: |
          {
            echo "### Weekly special-situations scan"
            echo "| Category | Count |"
            echo "|---|---|"
            echo "| Spin-offs (10-12B) | **${{ steps.count.outputs.spin }}** |"
            echo "| Post-reorg emergences | **${{ steps.count.outputs.emerge }}** |"
            echo "| Chapter 11 watch (do not buy old equity) | ${{ steps.count.outputs.watch }} |"
            if [ "${{ steps.count.outputs.reorg }}" = "failed" ]; then
              echo ""
              echo "Post-reorg scan failed this week - check the step log. Spin-off results are unaffected."
            fi
            echo ""
            echo "Size filter first. Notes: \`notes/\` (spin-offs), \`notes/reorg/\`, \`notes/reorg-watch/\`."
          } >> $GITHUB_STEP_SUMMARY

      - name: Commit results
        run: |
          git config user.name  "spinoff-watch bot"
          git config user.email "actions@github.com"
          git add spinoff_out/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "scan $(date -u +%Y-%m-%d): ${{ steps.count.outputs.spin }} spinoffs, ${{ steps.count.outputs.emerge }} emergences"
            git push
          fi

      - name: Open an issue if there is something to read
        # Chapter 11 watch items alone never trigger an issue — too noisy, nothing to act on.
        if: steps.count.outputs.spin > 0 || steps.count.outputs.emerge > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Scan of $(date -u +%Y-%m-%d)."
            echo ""
            if [ "${{ steps.count.outputs.spin }}" -gt 0 ]; then
              echo "**Spin-offs (${{ steps.count.outputs.spin }})**"
              echo '```'
              cut -d, -f1,2,3 spinoff_out/spinoffs.csv
              echo '```'
            fi
            if [ "${{ steps.count.outputs.emerge }}" -gt 0 ]; then
              echo "**Post-reorg emergences (${{ steps.count.outputs.emerge }})**"
              echo '```'
              grep '^EMERGENCE,' spinoff_out/reorg.csv | cut -d, -f2,4,5
              echo '```'
              echo "Read references/post-reorg.md first. Pre-emergence XBRL is the dead capital structure."
            fi
            echo ""
            echo "1. Size filter first - over ~\$500M, discard unread. Shell names hide big parents."
            echo "2. Post-reorg: Pink with no info, or a Form 15 filing -> discard."
            echo "3. Who is forced to sell, and is it unrelated to value? No forced seller -> cut."
            echo ""
            echo "Close this issue once triaged."
          } > /tmp/issue_body.md
          gh issue create \
            --title "Special-situations scan $(date -u +%Y-%m-%d): ${{ steps.count.outputs.spin }} spinoffs, ${{ steps.count.outputs.emerge }} emergences" \
            --body-file /tmp/issue_body.md
